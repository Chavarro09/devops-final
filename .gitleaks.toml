# Configuración de Gitleaks: reglas por defecto + una excepción justificada.
[extend]
useDefault = true

[allowlist]
description = "Falso positivo: huella PÚBLICA de la clave GPG de los releases de Python"
# La imagen oficial python:3.12-slim define la variable de entorno
# GPG_KEY=7169605F62C751356D054A26A821E680E5FA6305, que es la huella de la clave
# pública con la que el equipo de CPython firma sus versiones (no es un secreto).
# Trivy la copia en reportes/trivy.json y Gitleaks la confunde con una API key.
# Se permite solo esta huella exacta; cualquier otro secreto se sigue detectando.
regexes = ['''7169605F62C751356D054A26A821E680E5FA6305''']
